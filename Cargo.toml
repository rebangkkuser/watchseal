[package]
name = "watchseal"
version = "0.1.0-dev"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native Android event monitor: watchseald (daemon) and watchsealctl (CLI)"

[lib]
name = "watchseal"
path = "src/lib.rs"

[[bin]]
name = "watchseald"
path = "src/bin/watchseald.rs"

[[bin]]
name = "watchsealctl"
path = "src/bin/watchsealctl.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
